<div [@routerTransition] class="card card-bordered gutter-b card-stretch">
    <!--begin::Body-->
    <div class="card-body text-center pt-4">
        <div class="alert bg-light-primary" role="alert">
            <div class="alert-text" style="font-weight: bold">
                {{ 'YourSessionIsLocked' | localize }}
                <i class="fa fa-lock float-end mt-1 me-5"></i>
            </div>
        </div>
        <!--begin::User-->
        <div class="mt-7 pb-2">
            <div class="symbol symbol-circle symbol-lg-75">
                @if (userInfo && userInfo.profilePicture) {
                    <img [src]="userInfo.profilePicture" alt="profileimage" class="symbol-label" />
                }
            </div>
        </div>
        <!--end::User-->
        <!--begin::Name-->
        <div class="my-2">
            <a class="text-dark fw-bold text-hover-primary fs-h4" href="#">{{ userInfo.userName }}</a>
        </div>
        <!--end::Name-->
        <!--begin::Name-->
        <div class="my-2">
            <span class="text-dark fw-normal fs-h4">
                Tenant:
                <span class="text-dark fw-bold">{{ userInfo.tenant }}</span>
            </span>
        </div>
        @if (isExternalLoginEnabled) {
            <form #externalLoginForm="ngForm" (ngSubmit)="externalLogin()" class="form mt-4" method="post" novalidate>
                <div class="my-4">
                    <button
                        [disabled]="isExternalLoginButtonDisabled"
                        class="btn btn-sm btn-primary fw-bolder fs-h6 col-5"
                        type="submit"
                    >
                        {{ 'LogIn' | localize }}
                    </button>
                </div>
            </form>
        }
        @if (!isExternalLoginEnabled) {
            <form #loginForm="ngForm" (ngSubmit)="login()" class="form mt-4" method="post" novalidate>
                <div class="my-2">
                    <div class="mb-5">
                        <input name="usernameOrEmailAddress" type="hidden" />
                    </div>
                    <div class="mb-5">
                        <input
                            #passwordInput="ngModel"
                            [(ngModel)]="loginService.authenticateModel.password"
                            autocomplete="new-password"
                            class="form-control form-control-solid h-auto px-6 rounded-lg fs-h6"
                            maxlength="32"
                            name="password"
                            placeholder="{{ 'Password' | localize }}*"
                            required
                            type="password"
                        />
                        @if (!passwordInput.touched) {
                            <validation-messages [formCtrl]="passwordInput"></validation-messages>
                        }
                    </div>
                </div>
                <!--end::Name-->
                <!--begin::Buttons-->
                <div class="mt-9 mb-6">
                    <div class="col-5 mt-2 float-start">
                        <label class="form-check form-check-custom form-check-solid py-1">
                            <input
                                [(ngModel)]="loginService.rememberMe"
                                class="form-check-input"
                                name="rememberMe"
                                type="checkbox"
                                value="true"
                            />
                            <span class="form-check-label">
                                {{ 'RememberMe' | localize }}
                            </span>
                        </label>
                    </div>
                    <button
                        [disabled]="isLoginButtonDisabled"
                        class="btn btn-sm btn-primary fw-bolder fs-h6 col-5 float-end"
                        type="submit"
                    >
                        {{ 'LogIn' | localize }}
                    </button>
                </div>
                <!--end::Buttons-->
            </form>
        }
    </div>
    <!--end::Body-->
</div>
