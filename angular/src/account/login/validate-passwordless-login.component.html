<div [@routerTransition] class="login-form">
    <div class="pb-13 pt-lg-0 pt-5">
        <h3>
            {{ 'VerifyPasswordlessCode' | localize }}
        </h3>
    </div>
    <p class="pb-5">{{ 'ConfirmationPasswordlessCodeSentTo' | localize: selectedProviderInputValue }}</p>
    <form #passwordlessLoginCodeForm="ngForm" (ngSubmit)="submit()" class="login-form form" method="post">
        <div class="mb-5">
            <input
                #passwordlessCodeInput="ngModel"
                [(ngModel)]="passwordlessCode"
                autoFocus
                autocomplete="passwordlessCode"
                class="form-control form-control-solid h-auto px-6 rounded-lg fs-h6"
                maxlength="6"
                name="passwordlessCode"
                placeholder="{{ 'Code' | localize }} *"
                required
                type="text"
            />
            <validation-messages [formCtrl]="passwordlessCodeInput"></validation-messages>
        </div>
        <div class="pb-lg-0 pb-5">
            <button
                [disabled]="isSubmitButtonDisabled"
                class="btn btn-sm btn-primary fw-bolder fs-h6 px-8 py-3 my-3 me-3"
                type="submit"
            >
                {{ 'Submit' | localize }}
            </button>
            @if (remainingSeconds >= 0) {
                <span class="remaining-time-counter ml-5">
                    {{ 'RemainingTime' | localize }}: {{ 'SecondShort{0}' | localize: remainingSeconds }}.
                </span>
            }
        </div>
    </form>
</div>
