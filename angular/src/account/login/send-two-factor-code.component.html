<div [@routerTransition] class="login-form">
    <div class="pb-13 pt-lg-0 pt-5">
        <h3 class="fw-bolder text-dark fs-h4 fs-h1-lg">
            {{ 'SendSecurityCode' | localize }}
        </h3>
    </div>
    @if (loginService.authenticateResult) {
        <form #twoFactorForm="ngForm" (ngSubmit)="submit()" class="login-form form" method="post">
            <p>{{ 'SendSecurityCode_Information' | localize }}</p>
            <div class="mb-5">
                <select
                    [(ngModel)]="selectedTwoFactorProvider"
                    autoFocus
                    class="form-control form-control-solid h-auto px-6 rounded-lg fs-h6"
                    name="selectedTwoFactorProvider"
                    size="1"
                >
                    @for (provider of loginService.authenticateResult.twoFactorAuthProviders; track provider) {
                        <option [value]="provider">
                            {{ provider }}
                        </option>
                    }
                </select>
            </div>
            <div class="pb-lg-0 pb-5">
                <button class="btn btn-sm btn-primary fw-bolder fs-h6 px-8 py-3 my-3 me-3" type="submit">
                    {{ 'Submit' | localize }}
                </button>
            </div>
        </form>
    }
</div>
