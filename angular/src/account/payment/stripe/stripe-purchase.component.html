<div [@routerTransition] class="login-form">
    <div class="card card-bordered">
        <div class="card-header align-items-center">
            <h3>
                {{ 'TenantSignUp' | localize }}
            </h3>
        </div>
        <div class="card-body">
            <div class="mb-5 row">
                <label class="col-sm-4">{{ l('Item') }}</label>
                <div class="col-sm-8 text-end">
                    <p class="fw-bold">
                        {{ description }}
                    </p>
                </div>
            </div>
            <div class="mb-5 row">
                <label class="col-sm-4">{{ l('Price') }}</label>
                <div class="col-sm-8 text-end">
                    <p class="fw-bold" id="totalPrice">
                        {{ appSession.application.currencySign }}{{ amount | number: '1.2-2' }}
                    </p>
                </div>
            </div>
            <button [disabled]="stripeIsLoading" class="btn btn-primary w-100" id="stripe-checkout">
                {{ 'Purchase' | localize }}
            </button>
            @if (stripeIsLoading) {
                <div [busyIf]="stripeIsLoading"></div>
            }
        </div>
    </div>
</div>
