<div [@routerTransition] class="login-form">
    <div class="pb-13 pt-lg-0 pt-5">
        <h3 class="fw-bolder text-dark fs-h4 fs-h1-lg">
            {{ 'EmailActivation' | localize }}
        </h3>
    </div>
    <form (ngSubmit)="save()" [formGroup]="emailActivationForm" class="login-form form" method="post" novalidate>
        <p>
            {{ 'SendEmailActivationLink_Information' | localize }}
        </p>
        <div class="mb-5">
            <input
                autocomplete="new-password"
                class="form-control form-control-solid h-auto px-6 rounded-lg fs-h6"
                formControlName="emailAddress"
                placeholder="{{ 'EmailAddress' | localize }} *"
                type="email"
            />
            <validation-messages [formCtrl]="emailActivationForm.get('emailAddress')"></validation-messages>
        </div>
        <div class="pb-lg-0 pb-5">
            <button
                [disabled]="saving"
                class="btn btn-sm btn-light-primary fw-bolder fs-h6 px-8 py-3 my-3"
                routerLink="/account/login"
                type="button"
            >
                <i class="fa fa-arrow-left"></i>
                {{ 'Back' | localize }}
            </button>
            <button
                [busyText]="l('SavingWithThreeDot')"
                [buttonBusy]="saving"
                [disabled]="emailActivationForm.invalid"
                class="btn btn-sm btn-primary fw-bolder fs-h6 px-8 py-3 my-3 me-3"
                type="submit"
            >
                <i class="fa fa-check"></i>
                {{ 'Submit' | localize }}
            </button>
        </div>
    </form>
</div>
