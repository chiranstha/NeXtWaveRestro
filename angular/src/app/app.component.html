<div [ngClass]="{ 'subscription-bar-visible': subscriptionStatusBarVisible() }" class="d-flex flex-column flex-root">
    @if (theme == 'default') {
        <default-layout></default-layout>
    }
    @if (theme == 'theme2') {
        <theme2-layout class="d-flex flex-column flex-row-fluid"></theme2-layout>
    }
    @if (theme == 'theme3') {
        <theme3-layout></theme3-layout>
    }
    @if (theme == 'theme8') {
        <theme8-layout class="d-flex flex-column flex-row-fluid"></theme8-layout>
    }
    @if (theme == 'theme11') {
        <theme11-layout></theme11-layout>
    }
</div>
<kt-scroll-top></kt-scroll-top>
@if (!installationMode) {
    <linkedAccountsModal #linkedAccountsModal (modalClose)="getRecentlyLinkedUsers()"></linkedAccountsModal>
}
<userDelegationsModal #userDelegationsModal></userDelegationsModal>
<changePasswordModal #changePasswordModal></changePasswordModal>
<changeProfilePictureModal #changeProfilePictureModal></changeProfilePictureModal>
<mySettingsModal #mySettingsModal (modalSave)="onMySettingsModalSaved()"></mySettingsModal>
<notificationSettingsModal #notificationSettingsModal></notificationSettingsModal>
<addFriendModal #addFriendModal></addFriendModal>
@if (!installationMode) {
    <chat-bar #chatBarComponent [addFriendModal]="addFriendModal"></chat-bar>
}
@if (!installationMode && isQuickThemeSelectEnabled) {
    <theme-selection-panel #themeSelectionPanelComponent></theme-selection-panel>
}
@if (IsSessionTimeOutEnabled) {
    <session-timeout #sessionTimeout></session-timeout>
}
<app-update-notification></app-update-notification>
