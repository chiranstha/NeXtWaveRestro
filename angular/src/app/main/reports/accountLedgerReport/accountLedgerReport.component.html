<div [@routerTransition]>
    <sub-header [description]="''" [title]="'Account Ledger Report' | localize">
        <div role="search">
            <div class="position-relative w-md-400px me-md-2">
                <i
                    class="fa-duotone fa-magnifying-glass fs-3 text-gray-500 position-absolute top-50 translate-middle ms-6">
                    <span class="path1"></span><span class="path2"></span>
                </i>
                <input (input)="searchValueOnApiCall($event.target.value)"
                    (keyup.enter)="searchValueOnApiCall($event.target.value)" [(ngModel)]="filterText"
                    [ngModelOptions]="{ standalone: true }"
                    class="form-control form-control-solid ps-10 headerSearch" name="search" placeholder="Search"
                    type="text">
            </div>
        </div>
    </sub-header>

    <div [class]="containerClass">
        <div class="card card-bordered p-4">
            <form [formGroup]="myForm">
                <div class="row g-3 align-items-end mb-4">
                    <div class="col d-flex align-items-center justify-content-between gap-2">
                        <span (click)="advancedFiltersAreShown = !advancedFiltersAreShown"
                            class="clickable-item text-muted">
                            <i [class]="advancedFiltersAreShown ? 'fa fa-angle-up' : 'fa fa-angle-down'"></i>
                            {{ (advancedFiltersAreShown ? 'HideAdvancedFilters' : 'ShowAdvancedFilters') | localize }}
                        </span>
                        <button (click)="loadreport()" class="btn btn-sm btn-primary" type="button">
                            <i class="fa fa-sync-alt me-1"></i>
                            {{ 'Load' | localize }}
                        </button>
                    </div>
                </div>

                <div [hidden]="!advancedFiltersAreShown">
                    <div class="row g-4 align-items-end">
                        <div class="col-xxl-3 col-lg-4 col-md-6 col-12">
                            <label class="form-label" for="fromMiti">From Date(NP)</label>
                            <ne-datepicker [dateFormat]="'yyyy/MM/dd'"
                                [formControl]="myForm.controls['fromMiti']" [placeholder]="'yyyy/MM/dd'"
                                [todayBtn]="true" language="en"></ne-datepicker>
                        </div>

                        <div class="col-xxl-3 col-lg-4 col-md-6 col-12">
                            <label class="form-label" for="toMiti">To Date(NP)</label>
                            <ne-datepicker [dateFormat]="'yyyy/MM/dd'"
                                [formControl]="myForm.controls['toMiti']" [placeholder]="'yyyy/MM/dd'"
                                [todayBtn]="true" language="en"></ne-datepicker>
                        </div>

                        <div class="col-xxl-3 col-lg-4 col-md-6 col-12">
                            <label class="form-label" for="groupId">Account Group</label>
                            <ng-select (change)="loadreport()" [items]="allAccountGroups" bindLabel="displayName"
                                bindValue="id" formControlName="groupId" id="groupId"></ng-select>
                        </div>

                        <div class="col-xxl-3 col-lg-4 col-md-6 col-12">
                            <label class="form-label" for="isZeroBalance">{{ l('Show 0 value') }}</label>
                            <div class="form-check mt-2">
                                <input (change)="toggleVisibility($event)" class="form-check-input"
                                    formControlName="isZeroBalance" id="isZeroBalance" name="Filter"
                                    type="checkbox">
                            </div>
                        </div>
                    </div>
                </div>
            </form>

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <div class="text-muted small">
                    Showing <span class="fw-bold text-primary">{{ totalRecords || 0 }}</span> ledgers
                </div>
                <div class="text-muted small">Double-click a row to open details</div>
            </div>

            <div class="ag-theme-balham academic-report-grid w-100" [style.height.px]="screenHeight">
                <ag-grid-angular (cellDoubleClicked)="onCellDoubleClicked($event)"
                    (gridReady)="onGridReady($event)" [columnDefs]="columnDefs" [gridOptions]="gridOptions"
                    [pinnedBottomRowData]="gridOptions.pinnedBottomRowData" [rowData]="rowData"
                    style="width: 100%; height: 100%;">
                </ag-grid-angular>
            </div>
        </div>
    </div>
</div>
