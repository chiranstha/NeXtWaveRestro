<div [@routerTransition]>
    <sub-header (filterEvent)="openAdvanceFilter($event)" (input)="searchFilter($event)" [isAdd]="false"
        [isSimpleHeader]="true" [title]="'Account Groups Report'"></sub-header>
    <div [class]="containerClass">

        <!-- table-box css in ageing-report component.css-->
        <div class="card card-bordered p-4">
            <form [formGroup]="form">
                <div class="row g-4 align-items-end">

                    <div class="col-lg-4 col-md-6 col-12">
                        <label class="form-label" for="fromMiti">From Date(NP)</label>
                        <div>
                            <ne-datepicker [formControl]="form.controls['fromMiti']" [todayBtn]="true"
                                language="en"></ne-datepicker>
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-6 col-12">
                        <label class="form-label" for="toMiti">To Date(NP)</label>
                        <div>
                            <ne-datepicker [formControl]="form.controls['toMiti']" [todayBtn]="true"
                                language="en"></ne-datepicker>
                        </div>
                    </div>
                    <div class="col-12 d-flex justify-content-end flex-wrap gap-2 mt-2">
                        <a (click)="loadreport()" class="btn btn-sm btn-flex btn-primary fw-bold">
                            <i class="fa-duotone fa-rotate-right fs-6 text-light me-1 ">
                                <span class="path1"></span>
                                <span class="path2"></span>
                                <span class="path3"></span>
                                <span class="path4"></span>
                            </i> Refresh
                        </a>
                        <!-- <a (click)="exportAsXLSX(tableData)" class="btn btn-sm btn-flex btn-primary fw-bold">
                            <i class="fa-duotone fa-file-spreadsheet fs-6 text-light me-1 ">
                                <span class="path1"></span>
                                <span class="path2"></span>
                                <span class="path3"></span>
                                <span class="path4"></span>
                            </i> Excel
                        </a> -->
                        <a (click)="onAdvanceSearch(this.form.value)" class="btn btn-sm btn-flex btn-primary fw-bold">
                            Search
                        </a>

                    </div>
                </div>

            </form>
            <div [block]="true" [loading]="loading" class="row">
                <div class="overflow-x-auto">
                    <div class="table-box">
                        <div class="ag-theme-balham academic-report-grid" style="width: 100%; height: 800px">
                            <ag-grid-angular (gridReady)="onGridReady($event)" [columnDefs]="columnDefs"
                                [defaultColDef]="defaultColDef" [groupDefaultExpanded]="groupDefaultExpanded"
                                [pinnedBottomRowData]="pinnedBottomRowData" [rowData]="tableData" [rowGroupPanelShow]="rowGroupPanelShow"
                                style="width: 100%; height: 100%"></ag-grid-angular>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
