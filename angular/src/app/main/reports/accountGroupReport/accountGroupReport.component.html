<div>
    <sub-header [title]="'Account Group Report'">
        <div role="search">
            <input
                (keyup.enter)="searchValueOnApiCall($event.target.value)"
                class="form-control"
                placeholder="Search"
            />
        </div>
    </sub-header>

    <div class="card">
        <div class="card-body">
            <ag-grid-angular
                class="ag-theme-balham"
                [rowData]="tableData"
                [columnDefs]="columnDefs"
                [rowGroupPanelShow]="rowGroupPanelShow"
                [groupDefaultExpanded]="groupDefaultExpanded"
                (gridReady)="onGridReady($event)"
                style="width:100%; height:500px;">
            </ag-grid-angular>
        </div>
    </div>
</div>
