<div [@routerTransition]>
    <sub-header [title]="'Purchase Master Report'">
        <div role="search">
            <div class="position-relative w-md-400px me-md-2">
                <i
                    class="fa-duotone fa-magnifying-glass fs-3 text-gray-500 position-absolute top-50 translate-middle ms-6"
                >
                    <span class="path1"></span>
                    <span class="path2"></span>
                </i>
                <input
                    (input)="searchFilter($event)"
                    [ngModelOptions]="{ standalone: true }"
                    class="form-control form-control-solid ps-10 headerSearch"
                    name="search"
                    placeholder="Search"
                    type="text"
                />
            </div>
        </div>
        <div role="actions">
            <button (click)="exportToExcelfromAPI()" class="btn btn-sm btn-flex btn-secondary fw-bold" type="button">
                <i class="fa fa-file-excel"></i>
                Excel
            </button>
        </div>
    </sub-header>

    <div [class]="containerClass">
        <div class="card card-bordered p-4">
            <div [hidden]="!advancedFiltersAreShown" class="col-12 p-3">
                <div class="hidden-filter">
                    <div>
                        <form [formGroup]="myForm">
                            <div class="row">
                                <div class="col-lg-3 col-xl-3 col-md-3 col-xs-12">
                                    <label class="form-label" for="fromMiti">From Date</label>
                                    <div>
                                        <ne-datepicker (change)="loadReport()" [dateFormat]="'yyyy/MM/dd'"
                                                       [formControl]="myForm.controls['fromMiti']"
                                                       [placeholder]="'yyyy/MM/dd'"
                                                       [todayBtn]="true"
                                                       language="en"></ne-datepicker>
                                    </div>
                                </div>
                                <div class="col-lg-3 col-xl-3 col-md-3 col-xs-12">
                                    <label class="form-label" for="toMiti">To Date</label>
                                    <div>
                                        <ne-datepicker (change)="loadReport()" [dateFormat]="'yyyy/MM/dd'"
                                                       [formControl]="myForm.controls['toMiti']"
                                                       [placeholder]="'yyyy/MM/dd'"
                                                       [todayBtn]="true"
                                                       language="en"></ne-datepicker>
                                    </div>
                                </div>                                
                                <div class="col-lg-3 col-xl-3 col-md-3 col-xs-12">
                                    <label class="form-label" for="ledgerId">Ledger</label>
                                    <ng-select (change)="loadReport()" [items]="allLedgers" bindLabel="displayName"
                                               bindValue="id" formControlName="ledgerId" id="ledgerId"></ng-select>
                                </div>
                                <div class="col-lg-3 col-xl-3 col-md-3 col-xs-12">
                                    <label class="form-label" for="productId">Product</label>
                                    <ng-select (change)="loadReport()" [items]="allProducts" bindLabel="displayName"
                                               bindValue="id" formControlName="productId" id="productId"></ng-select>
                                </div>
                                <div class="mt-15" class="col-lg-3 col-xl-3 col-md-3 col-xs-12">
                                    <label class="form-label" for="showDetails">{{ l('Show Details') }}</label>
                                    <div>
                                        <input (change)="loadReport()" Class="form-check-input" class="form-check-input"
                                               formControlName="showDetails" id="showDetails" name="Filter"
                                               type="checkbox"/>
                                    </div>
                                </div>

                                <div class="col-lg-4 col-xl-4 col-md-4 col-xs-4 pt-5">
                                    <a (click)="loadReport()" class="btn btn-sm btn-flex btn-primary fw-bold">
                                        <i class="fa fa-search"></i>
                                        Search
                                    </a>
                                    <a (click)="refreshLoad()" class="btn btn-sm btn-flex btn-primary fw-bold">
                                        <i class="fa-duotone fa-rotate-right fs-6 text-light me-1">
                                        </i>
                                        Reset
                                    </a>
                                    <!-- <a (click)="downloadPdf()" class="btn btn-sm btn-flex btn-primary fw-bold">
                                        <i class="fa-solid fa-file-pdf"></i>
                                        PDF
                                    </a> -->

                                    <a (click)="exportToExcelfromAPI()" class="btn btn-sm btn-flex btn-secondary fw-bold">
                                        <i class="fa-solid fa-file-pdf"></i>
                                        Excel
                                    </a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="row mb-4">
                <div class="col-sm-12">
                    <span
                        (click)="advancedFiltersAreShown = !advancedFiltersAreShown"
                        *ngIf="!advancedFiltersAreShown"
                        class="clickable-item text-muted"
                    >
                        <i class="fa fa-angle-down"></i>
                        {{ 'ShowAdvancedFilters' | localize }}
                    </span>
                    <span
                        (click)="advancedFiltersAreShown = !advancedFiltersAreShown"
                        *ngIf="advancedFiltersAreShown"
                        class="clickable-item text-muted"
                    >
                        <i class="fa fa-angle-up"></i>
                        {{ 'HideAdvancedFilters' | localize }}
                    </span>
                </div>
            </div>

            <div class="overflow-x-scroll pt-5">
                <ag-grid-angular
                    class="ag-theme-balham"
                    style="width: 100%; height: 600px;"
                    [columnDefs]="columnDefs"
                    [defaultColDef]="defaultColDef"
                    [pinnedBottomRowData]="pinnedBottomRowData"
                    [rowData]="displayedTableRows"
                ></ag-grid-angular>
            </div>
            <div class="card mb-1">
                <div class="card card-bordered p-4">
                    <div *ngIf="isPdfShow" class="card">
                        <ngx-extended-pdf-viewer [src]="pdfdata"></ngx-extended-pdf-viewer>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
