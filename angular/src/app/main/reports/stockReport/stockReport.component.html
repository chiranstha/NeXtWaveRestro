<div [@routerTransition]>
    <sub-header [description]="" [title]="'Stock Report' | localize">
        <div role="search">
            <div class="position-relative w-md-400px me-md-2">
                <i
                    class="fa-duotone fa-magnifying-glass fs-3 text-gray-500 position-absolute top-50 translate-middle ms-6"><span
                        class="path1"></span><span class="path2"></span></i>
                <input (input)="searchValueOnApiCall($event.target.value)" [ngModelOptions]="{ standalone: true }"
                    class="form-control form-control-solid ps-10 headerSearch" name="search" placeholder="Search"
                    type="text" value="">
            </div>
        </div>
        <div role="actions">
            <button (click)="exportToExcelfromAPI($event)" class="btn btn-sm btn-primary">
                <i class="fa fa-plus btn-md-icon"></i>
                <span class="d-none d-md-inline-block">
                    {{ 'Export' | localize }}
                </span>
            </button>
            <div class="row mb-4">
                <div class="col-sm-12">
                    <span (click)="advancedFiltersAreShown = !advancedFiltersAreShown" *ngIf="!advancedFiltersAreShown"
                        class="clickable-item text-muted">
                        <i class="fa fa-angle-down"></i>
                        {{ 'ShowAdvancedFilters' | localize }}
                    </span>
                    <span (click)="advancedFiltersAreShown = !advancedFiltersAreShown" *ngIf="advancedFiltersAreShown"
                        class="clickable-item text-muted">
                        <i class="fa fa-angle-up"></i>
                        {{ 'HideAdvancedFilters' | localize }}
                    </span>
                </div>
            </div>
        </div>
    </sub-header>
    <div [class]="containerClass">
        <div class="card card-bordered p-4">
            <form [formGroup]="form">
                <div [hidden]="!advancedFiltersAreShown" class="col-12 px-0">
                    <div class="hidden-filter">
                        <div class="row">
                            <div class="col-lg-3 col-xl-3 col-md-3 col-xs-12">
                                <div class="mb-1">
                                    <label class="form-label" for="fromMiti">From Miti</label>
                                    <ne-datepicker [formControl]="form.controls['fromMiti']"
                                        language="en"></ne-datepicker>
                                </div>
                            </div>
                            <div class="col-lg-3 col-xl-3 col-md-3 col-xs-12">
                                <div class="mb-1">
                                    <label class="form-label" for="toMiti">To Miti</label>
                                    <ne-datepicker [formControl]="form.controls['toMiti']"
                                        language="en"></ne-datepicker>
                                </div>
                            </div>
                            <div class="col-lg-3 col-xl-3 col-md-3 col-xs-12">
                                <div class="mb-1">
                                    <label class="form-label" for="productGroupId">Product Group</label>
                                    <ng-select (change)="onSearch(this.form.value)" [items]="allProductGroups"
                                        bindLabel="displayName" bindValue="id" formControlName="productGroupId"
                                        id="producttGroupId"></ng-select>
                                </div>
                            </div>
                            <div class="col-lg-3 col-xl-3 col-md-3 col-xs-12">
                                <div class="mb-1">
                                    <label class="form-label" for="ledgerId">Ledger Name</label>
                                    <ng-select (change)="onSearch(this.form.value)" [items]="allAccountLedgers"
                                        bindLabel="displayName" bindValue="id" formControlName="ledgerId"
                                        id="ledgerId"></ng-select>
                                </div>
                            </div>
                            <div class="col-lg-1 col-xl-1 col-md-1 col-xs-12">
                                <label class="form-label" for="showProducts">{{ l('ZeroStock') }}</label>
                                <div>
                                    <input (change)="onSearch(this.form.getRawValue())" Class="form-check-input"
                                        class="form-check-input" formControlName="isZeroStock" id="isZeroStock"
                                        name="Filter" type="checkbox" />
                                </div>
                            </div>
                            <!-- <div class="col-lg-1 col-xl-1 col-md-1 col-xs-12"></div> -->
                            <div class="col-lg-4 col-xl-4 col-md-4 col-xs-3 mt-8">
                                <a (click)="refresh()" class="btn btn-sm btn-flex btn-primary fw-bold">
                                    <i class="fa-duotone fa-rotate-right fs-6 text-light me-1"> </i>
                                    Refresh
                                </a>
                                <a (click)="onSearch(this.form.value)" class="btn btn-sm btn-flex btn-primary fw-bold">
                                    <i class="fa fa-search"></i>Search</a>
                                <button (click)="excel()" class="btn btn-sm btn-flex btn-primary fw-bold" id="excel"
                                    label="Excel">Excel
                                </button>
                                <a (click)="pdfDownload()" class="btn btn-sm btn-flex btn-primary fw-bold">
                                    <i class="fa-solid fa-file-pdf"></i>
                                    PDF
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

            </form>
            <div *ngIf="!isPdfShow">
                <div class="overflow-x-auto border rounded-1">
                    <ag-grid-angular class="ag-theme-balham w-100" [gridOptions]="gridOptions" (gridReady)="onGridReady($event)"
                        [columnDefs]="columnDefs" [rowData]="tableRows"
                        (cellDoubleClicked)="onCellDoubleClicked($event)"
                        [pinnedBottomRowData]="pinnedBottomRowData" style="width: 100%; "
                        [style.height.px]="screenHeight">
                    </ag-grid-angular>
                </div>
            </div>
        </div>
    </div>
</div>
<div *ngIf="isPdfShow" [class]="containerClass">
    <sub-header [description]="title" [title]="title">
        <div role="actions">
            <button (click)="cancel()" class="btn btn-sm fw-bold btn-primary" id="cancel">Close
            </button>
        </div>
    </sub-header>
    <div class="card card-custom  ">
        <div class="card-body">
            <ngx-extended-pdf-viewer [showOpenFileButton]="false" [showSidebarButton]="false" [src]="pdfUrl"
                height="80vh" useBrowserLocale="true">
            </ngx-extended-pdf-viewer>
        </div>
    </div>
</div>
