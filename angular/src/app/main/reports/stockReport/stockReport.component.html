<div [@routerTransition] class="stock-report-page">
    <sub-header [description]="'Stock levels and movement for the selected period.' | localize" [title]="'Stock Report' | localize">
        <div class="stock-report-header-tools" role="group" aria-label="Stock report tools">
            <div role="search" class="stock-report-header-search">
                <label class="stock-report-search">
                    <i class="fa-duotone fa-magnifying-glass" aria-hidden="true"><span class="path1"></span><span class="path2"></span></i>
                    <input
                        (input)="searchValueOnApiCall($event.target.value)"
                        [ngModelOptions]="{ standalone: true }"
                        [attr.aria-label]="'Search stock items' | localize"
                        class="form-control headerSearch"
                        name="search"
                        placeholder="{{ 'Search products' | localize }}"
                        type="search"
                    />
                </label>
            </div>
            <button (click)="exportToExcelfromAPI($event)" [disabled]="loading" class="btn btn-sm btn-primary stock-report-header-export" type="button">
                <i class="fa fa-download" aria-hidden="true"></i>
                <span>{{ 'Export' | localize }}</span>
            </button>
        </div>
    </sub-header>

    <main [class]="containerClass + ' stock-report-content'">
        <section class="stock-report-filters card card-bordered" aria-label="Stock report filters">
            <div class="stock-report-filter-heading">
                <div>
                    <h2>{{ 'Report filters' | localize }}</h2>
                    <p>{{ 'Choose a period and narrow the report by product group or ledger.' | localize }}</p>
                </div>
                <button
                    (click)="advancedFiltersAreShown = !advancedFiltersAreShown"
                    [attr.aria-expanded]="advancedFiltersAreShown"
                    [attr.aria-controls]="'stock-report-filter-fields'"
                    class="btn btn-sm btn-light stock-report-filter-toggle"
                    type="button"
                >
                    <i class="fa" [ngClass]="advancedFiltersAreShown ? 'fa-angle-up' : 'fa-angle-down'" aria-hidden="true"></i>
                    {{ (advancedFiltersAreShown ? 'Hide filters' : 'Show advanced filters') | localize }}
                </button>
            </div>

            <form [formGroup]="form" (ngSubmit)="onSearch(form.getRawValue())">
                <div [hidden]="!advancedFiltersAreShown" class="stock-report-filter-fields" id="stock-report-filter-fields">
                    <div class="stock-report-field">
                        <label class="form-label" for="stock-report-from-miti">{{ 'From Miti' | localize }}</label>
                        <ne-datepicker
                            [formControl]="form.controls['fromMiti']"
                            [npDatePickerId]="'stock-report-from-miti'"
                            language="en"
                        ></ne-datepicker>
                    </div>
                    <div class="stock-report-field">
                        <label class="form-label" for="stock-report-to-miti">{{ 'To Miti' | localize }}</label>
                        <ne-datepicker
                            [formControl]="form.controls['toMiti']"
                            [npDatePickerId]="'stock-report-to-miti'"
                            language="en"
                        ></ne-datepicker>
                    </div>
                    <div class="stock-report-field">
                        <label class="form-label" for="stock-report-product-group">{{ 'Product Group' | localize }}</label>
                        <ng-select
                            (change)="onSearch(form.getRawValue())"
                            [items]="allProductGroups"
                            bindLabel="displayName"
                            bindValue="id"
                            formControlName="productGroupId"
                            id="stock-report-product-group"
                        ></ng-select>
                    </div>
                    <div class="stock-report-field">
                        <label class="form-label" for="stock-report-ledger">{{ 'Ledger Name' | localize }}</label>
                        <ng-select
                            (change)="onSearch(form.getRawValue())"
                            [items]="allAccountLedgers"
                            bindLabel="displayName"
                            bindValue="id"
                            formControlName="ledgerId"
                            id="stock-report-ledger"
                        ></ng-select>
                    </div>
                    <label class="stock-report-zero-stock" for="isZeroStock">
                        <input (change)="onSearch(form.getRawValue())" class="form-check-input" formControlName="isZeroStock" id="isZeroStock" type="checkbox" />
                        <span>{{ 'Include zero stock' | localize }}</span>
                    </label>
                    <div class="stock-report-filter-actions">
                        <button (click)="refresh()" class="btn btn-sm btn-light" type="button">
                            <i class="fa fa-rotate-right" aria-hidden="true"></i>
                            {{ 'Reset' | localize }}
                        </button>
                        <button class="btn btn-sm btn-primary" type="submit" [disabled]="loading">
                            <i class="fa fa-search" aria-hidden="true"></i>
                            {{ 'Search' | localize }}
                        </button>
                        <button (click)="excel()" class="btn btn-sm btn-outline-secondary" type="button" [disabled]="loading">
                            <i class="fa fa-file-excel" aria-hidden="true"></i>
                            {{ 'Excel' | localize }}
                        </button>
                        <button (click)="pdfDownload()" class="btn btn-sm btn-outline-secondary" type="button" [disabled]="true" [title]="'PDF export is currently unavailable' | localize">
                            <i class="fa fa-file-pdf" aria-hidden="true"></i>
                            {{ 'PDF' | localize }}
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <section class="stock-report-table card card-bordered" aria-label="Stock report results">
            <div *ngIf="reportLoadError" class="stock-report-error" role="alert">
                <div>
                    <strong>{{ 'Stock report could not be loaded' | localize }}</strong>
                    <p>{{ 'Check your connection and try again.' | localize }}</p>
                </div>
                <button (click)="loadReportData()" class="btn btn-sm btn-primary" type="button">
                    {{ 'Retry' | localize }}
                </button>
            </div>
            <div *ngIf="!isPdfShow && !reportLoadError" class="stock-report-grid-wrap">
                <ag-grid-angular
                    (gridReady)="onGridReady($event)"
                    (cellClicked)="onCellDoubleClicked($event)"
                    (cellDoubleClicked)="onCellDoubleClicked($event)"
                    [columnDefs]="columnDefs"
                    [gridOptions]="gridOptions"
                    [loading]="loading"
                    [pinnedBottomRowData]="pinnedBottomRowData"
                    [rowData]="tableRows"
                    class="ag-theme-balham stock-report-grid"
                ></ag-grid-angular>
            </div>
        </section>
    </main>
</div>

<div *ngIf="isPdfShow" [class]="containerClass + ' stock-report-content'">
    <sub-header [description]="title" [title]="title">
        <div role="actions">
            <button (click)="cancel()" class="btn btn-sm fw-bold btn-primary" id="cancel" type="button">{{ 'Close' | localize }}</button>
        </div>
    </sub-header>
    <div class="card card-custom">
        <div class="card-body">
            <ngx-extended-pdf-viewer [showOpenFileButton]="false" [showSidebarButton]="false" [src]="pdfUrl" height="80vh" useBrowserLocale="true"></ngx-extended-pdf-viewer>
        </div>
    </div>
</div>
