<section class="restaurant-staff-page">
    <header class="restaurant-staff-header"><div><span class="staff-kicker">RESTAURANT</span><h1>Reservations and waitlist</h1><p>Assign a table, manage requests, and seat walk-ins. Seating opens the table session for QR orders.</p></div><button class="btn btn-light-primary" [disabled]="loading" (click)="load()"><i class="fa fa-rotate"></i> Refresh</button></header>
    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
    <div class="alert alert-success" *ngIf="message">{{ message }}</div>

    <section class="reservation-card">
        <h2>Add a walk-in</h2>
        <div class="staff-form-row">
            <label>Guest name<input [(ngModel)]="guestName" maxlength="200" /></label>
            <label>Phone (optional)<input [(ngModel)]="phoneNumber" maxlength="30" /></label>
            <label>Party size<input type="number" min="1" max="30" [(ngModel)]="partySize" /></label>
            <label>Notes<input [(ngModel)]="notes" maxlength="500" /></label>
            <button type="button" class="btn btn-primary" [disabled]="loading" (click)="addWalkIn()">Add to waitlist</button>
        </div>
    </section>

    <div class="table-wrap ag-theme-balham">
        <ag-grid-angular
            [columnDefs]="columnDefs"
            [defaultColDef]="defaultColDef"
            [rowData]="reservations"
            [loading]="loading"
            [animateRows]="true"
            [rowHeight]="72"
            [style.height.px]="520"
            style="width: 100%"
        ></ag-grid-angular>
        <div *ngIf="!loading && !reservations.length" class="text-center text-muted py-8">
            No reservations or walk-ins in this date range.
        </div>
    </div>
</section>
