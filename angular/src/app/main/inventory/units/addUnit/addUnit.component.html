<div *ngIf="dialog">
    <div
        #createOrEditModal="bs-modal"
        [config]="{ backdrop: 'static', keyboard: false }"
        aria-hidden="true"
        bsModal
        class="modal fade"
        role="dialog"
        tabindex="-1"
    >
        <div class="modal-dialog modal-lg modal-dialog-scrollable mt-5">
            <div class="modal-content">
                <div *ngIf="active">
                    <div class="modal-header px-6 py-3">
                        <h5 class="modal-title fw-bold mb-0">{{ l(this.id ? 'Edit Unit' : 'Create Unit') }}</h5>
                        <button
                            (click)="close()"
                            [disabled]="saving"
                            aria-label="Close"
                            class="btn-close"
                            type="button"
                        ></button>
                    </div>
                    <div class="modal-body px-6 py-4">
                        <ng-container *ngTemplateOutlet="unitFormContent"></ng-container>
                    </div>
                    <ng-container *ngTemplateOutlet="dialogActions"></ng-container>
                </div>
            </div>
        </div>
    </div>
</div>

<div [@routerTransition] *ngIf="!dialog && serialNumber === 0">
    <sub-header [description]="" [title]="title | localize">
        <div role="actions">
            <button *ngIf="this.id" (click)="clearForm(id)" class="btn btn-sm btn-light-danger fw-bold me-2">
                <i class="fa-duotone fa-trash fs-2">
                    <span class="path1"></span>
                    <span class="path2"></span>
                    <span class="path3"></span>
                    <span class="path4"></span>
                </i>
            </button>
            <button
                (click)="save()"
                [buttonBusy]="saving"
                [disabled]="form.invalid"
                class="btn btn-sm fw-bold btn-primary me-2"
                id="save"
                type="submit"
            >
                <i class="fa-duotone fa-circle-plus fs-2">
                    <span class="path1"></span>
                    <span class="path2"></span>
                    <span class="path3"></span>
                </i>
                {{ l(this.id ? 'Update' : 'Save') }}
            </button>
            <button (click)="close()" class="btn btn-sm fw-bold btn-light-success" id="cancel">
                <i class="fa-duotone fa-circle-xmark fs-2">
                    <span class="path1"></span>
                    <span class="path2"></span>
                    <span class="path3"></span>
                </i>
                {{ l('Cancel') }}
            </button>
        </div>
    </sub-header>

    <div [class]="containerClass">
        <div class="card card-custom gutter-b">
            <div class="card-body">
                <ng-container *ngTemplateOutlet="unitFormContent"></ng-container>
                <hr />
            </div>
        </div>
    </div>
</div>

<ng-template #unitFormContent>
    <form [formGroup]="form" autocomplete="off">
        <div class="row">
            <div class="col-lg-4 col-md-4 col-sm-6 col-12 mb-4">
                <div class="mb-1">
                    <label class="required form-label" for="name">{{ l('Name') }}</label>
                    <input
                        #names
                        (input)="titleCase(form, $event.target.value, 'name')"
                        (keyup)="gotoFname($event)"
                        [ngClass]="
                            this.form.get('name').invalid &&
                            (this.form.get('name').dirty || this.form.get('name').touched)
                                ? 'is-danger'
                                : 'is-success'
                        "
                        class="form-control"
                        formControlName="name"
                        id="name"
                        name="name"
                        required
                        type="text"
                    />
                </div>
            </div>

            <div class="col-lg-4 col-md-4 col-sm-6 col-12 mb-4">
                <div class="mb-1">
                    <label class="required form-label" for="formalName">{{ l('Formal Name') }}</label>
                    <input
                        #fname
                        (input)="titleCase(form, $event.target.value, 'formalName')"
                        (keyup)="gotoDecimal($event)"
                        [ngClass]="
                            this.form.get('formalName').invalid &&
                            (this.form.get('formalName').dirty || this.form.get('formalName').touched)
                                ? 'is-danger'
                                : 'is-success'
                        "
                        class="form-control"
                        formControlName="formalName"
                        id="formalName"
                        maxlength="100"
                        name="formalName"
                        required
                        type="text"
                    />
                </div>
            </div>

            <div class="col-lg-4 col-md-4 col-sm-6 col-12 mb-4">
                <div class="mb-1">
                    <label class="required form-label" for="noOfDecimalPlaces">{{ l('No of Decimal Places') }}</label>
                    <input
                        #decimals
                        (keyup)="gotoDescription($event, form)"
                        [ngClass]="
                            this.form.get('noOfDecimalPlaces').invalid &&
                            (this.form.get('noOfDecimalPlaces').dirty || this.form.get('noOfDecimalPlaces').touched)
                                ? 'is-danger'
                                : 'is-success'
                        "
                        class="form-control"
                        formControlName="noOfDecimalPlaces"
                        id="noOfDecimalPlaces"
                        min="0"
                        type="number"
                    />
                </div>
            </div>

            <div class="col-md-8 col-lg-8 col-12 mb-4">
                <div class="mb-1">
                    <label class="form-label" for="description">{{ l('Description') }}</label>
                    <textarea
                        #descriptions
                        (keyup)="onSaveOnInput($event)"
                        class="form-control"
                        formControlName="description"
                        id="description"
                        maxlength="100"
                        type="text"
                    ></textarea>
                </div>
            </div>
        </div>
    </form>
</ng-template>

<ng-template #dialogActions>
    <div class="modal-footer justify-content-between px-6 py-4">
        <button *ngIf="this.id" (click)="clearForm(id)" class="btn btn-sm btn-light-danger fw-bold" type="button">
            <i class="fas fa-trash-alt me-1"></i>
            {{ l('Delete') }}
        </button>
        <div class="d-flex flex-wrap gap-2 ms-auto">
            <button
                (click)="save()"
                [buttonBusy]="saving"
                [disabled]="!form || form.invalid"
                class="btn btn-sm fw-bold btn-primary"
                type="submit"
            >
                <i class="fas fa-save me-1"></i>
                {{ l(this.id ? 'Update' : 'Save') }}
            </button>
            <button (click)="close()" class="btn btn-sm fw-bold btn-light-success" type="button">
                <i class="fas fa-times-circle me-1"></i>
                {{ l('Cancel') }}
            </button>
        </div>
    </div>
</ng-template>

<ng-keyboard-shortcuts [shortcuts]="shortcuts"></ng-keyboard-shortcuts>
<erp-key-event
    (closeEvent)="keyClose($event)"
    (deletEvent)="clearForm($event)"
    (saveEvent)="keySave($event)"
    [id]="this.id ? this.id : null"
></erp-key-event>
