<div *ngIf="!serialNumber" [class]="containerClass" [class]="defaultContainer" class="global_container">
    <div class="card delivery-card card-custom  ">
        <div class="form-title">
            <div class="row">
                <div class="col-lg-7 col-md-6 col-xl-6">
                    <h3 *ngIf="!this.id" class=" mt-2 mb-0">{{ l('Create PDC Clearance') }}</h3>
                    <h3 *ngIf="this.id" class=" mt-2 mb-0">{{ l('Edit PDC Clearance') }}</h3>
                </div>
                <div class="col-lg-6 col-xl-6 col-md-6 col-xs-12 text-right">
                    <span *ngIf="this.id">
                        <button (click)="clearForm(id)" class="btn btn-light-danger fw-bold me-2">
                            <i class="fa-duotone fa-trash ps-1 fs-2">
                                <span class="path1"></span>
                                <span class="path2"></span>
                                <span class="path3"></span>
                                <span class="path4"></span>
                            </i>
                        </button>
                    </span>

                    <button (click)="checkSave()" [buttonBusy]="saving" [disabled]="form.invalid"
                        class="mr-2 btn btn-sm fw-bold btn-primary" id="save" label="{{ this.id ? 'Update' : 'Save' }}"
                        type="submit">
                        <i class="fa-duotone fa-circle-plus fs-2">
                            <span class="path1"></span>
                            <span class="path2"></span>
                            <span class="path3"></span>
                        </i>
                        {{ l(this.id ? 'Update' : 'Save') }}
                    </button>

                    <button (click)="close()" class="mr-2 btn btn-sm fw-bold btn-light-success" id="cancel">
                        <i class="fa-duotone fa-circle-xmark fs-2">
                            <span class="path1"></span>
                            <span class="path2"></span>
                            <span class="path3"></span>
                        </i>
                        {{ l('Cancel') }}
                    </button>
                </div>
            </div>
        </div>

        <div class="card-body">
            <form [formGroup]="form">
                <div class="container-fluid">
                    <div class="row">                        
                        <div class="col-md-4 col-xl-4 col-xs-12 col-sm-12">
                            <div class="mb-1   ">
                                <label class="required form-label" for="dateMiti">{{ l('Date-Miti') }}</label>
                                <ne-datepicker (keyup.enter)="gotoPDC($event)" [formControl]="form.controls['dateMiti']"
                                    id="dateMiti" language="en"></ne-datepicker>
                                <div *ngIf="
                    this.form.get('dateMiti').invalid &&
                    (this.form.get('dateMiti').dirty || this.form.get('dateMiti').touched)
                  ">
                                    <div class="alert alert-danger alert-height mt-1" role="alert">
                                        <div class="alert-div">DateMiti is required!</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-xl-4 col-xs-12 col-sm-12">
                            <div class="mb-1   ">
                                <label class="required form-label" for="voucherNo">{{ l('Voucher No') }}</label>
                                <input #vouchernum (keyup.enter)="gofromvoucher()"
                                    [readonly]="this.automaticInput || this.id" class="form-control"
                                    formControlName="voucherNo" id="voucherNo" name="voucherNo" type="text"
                                    voucherNo="voucherNo" />
                            </div>
                        </div>
                        <div class="col-md-4 col-xl-4 col-xs-12 col-sm-12 mb-3">
                            <div class="mb-1   ">
                                <label class="required form-label" for="branchId">{{ l(' PDC Type') }}</label>
                                <ng-select #pdc (change)="clearFunc()" (keyup.enter)="gotoaccLedger()"
                                    [items]="againstMode" [readonly]="this.id" bindLabel="displayName" bindValue="id"
                                    formControlName="againstMode" id="typeId" placeholder="Select an item"></ng-select>
                                <div *ngIf="
                    this.form.get('againstMode').invalid &&
                    (this.form.get('againstMode').dirty || this.form.get('againstMode').touched)
                  ">
                                    <div class="alert alert-danger alert-height mt-1" role="alert">
                                        <div class="alert-div">Against Mode is required!</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-xl-4 col-xs-12 col-sm-12 mb-3">
                            <div class="mb-1   ">
                                <label class="required form-label" for="ledgerId">{{ l(' Account Ledger') }}</label>
                                <ng-select #accledger (change)="changeByLedger($event.id)"
                                    (keyup)="gotoagainstvoucher($event)" [items]="allLedgers" [readonly]="this.id"
                                    bindLabel="displayName" bindValue="id" formControlName="ledgerId" id="ledgerId"
                                    placeholder="Select an item"></ng-select>
                                <div *ngIf="
                    this.form.get('ledgerId').invalid &&
                    (this.form.get('ledgerId').dirty || this.form.get('ledgerId').touched)
                  ">
                                    <div class="alert alert-danger alert-height mt-1" role="alert">
                                        <div class="alert-div">Account Ledger is required!</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-xl-4 col-xs-12 col-sm-12 mb-3">
                            <div class="mb-1   ">
                                <label class="required form-label" for="ledgerId">{{ l('Against Voucher No') }}</label>
                                <ng-select #againstvoucher (change)="changeByPdc($event.id)"
                                    (keyup.enter)="gotoamount()" *ngIf="!this.id" [items]="pdcByData"
                                    bindLabel="displayName" bindValue="id" formControlName="againstId" id="ledgerId"
                                    placeholder="Select an item"></ng-select>
                                <div *ngIf="
                    this.form.get('againstId').invalid &&
                    (this.form.get('againstId').dirty || this.form.get('againstId').touched)
                  ">
                                    <div class="alert alert-danger alert-height mt-1" role="alert">
                                        <div class="alert-div">Against Voucher No is required!</div>
                                    </div>
                                </div>
                                <input *ngIf="this.id" [value]="againstId" class="form-control" />
                            </div>
                        </div>
                        <div class="col-md-4 col-xl-4 col-xs-12 col-sm-12 mb-3">
                            <div class="mb-1   ">
                                <label class="required form-label" for="amount">{{ l('Amount') }}</label>
                                <input #amount (keyup.enter)="gotostatus()" [ngClass]="
                    this.form.get('amount').invalid &&
                    (this.form.get('amount').dirty || this.form.get('amount').touched)
                      ? 'is-danger'
                      : 'is-success'
                  " class="form-control" formControlName="amount" id="amount" min="0" placeholder="" type="number" />
                            </div>
                        </div>
                        <div class="col-md-4 col-xl-4 col-xs-12 col-sm-12 mb-3">
                            <div class="mb-1   ">
                                <label class="required form-label" for="chequeMiti">{{ l('Cheque Date') }}</label>
                                <input [ngClass]="
                    this.form.get('chequeMiti').invalid &&
                    (this.form.get('chequeMiti').dirty || this.form.get('chequeMiti').touched)
                      ? 'is-danger'
                      : 'is-success'
                  " class="form-control" formControlName="chequeMiti" id="chequeMiti" placeholder="" type="text" />
                            </div>
                        </div>
                        <div class="col-md-4 col-xl-4 col-xs-12 col-sm-12 mb-3">
                            <div class="mb-1   ">
                                <label class="required form-label" for="chequeNo">{{ l('Cheque No.') }}</label>
                                <input [ngClass]="
                    this.form.get('chequeNo').invalid &&
                    (this.form.get('chequeNo').dirty || this.form.get('chequeNo').touched)
                      ? 'is-danger'
                      : 'is-success'
                  " class="form-control" formControlName="chequeNo" id="chequeNo" placeholder="" type="text" />
                            </div>
                        </div>
                        <div class="col-md-4 col-xl-4 col-xs-12 col-sm-12 mb-3">
                            <div class="mb-1   ">
                                <label class="required form-label" for="bankId">{{ l('Bank Name') }}</label>
                                <ng-select [items]="allBanks$ | async" appendTo="body" bindLabel="displayName"
                                    bindValue="id" formControlName="bankId" id="status" placeholder="Select an item"
                                    readonly="true"></ng-select>

                                <div *ngIf="
                    this.form.get('bankId').invalid &&
                    (this.form.get('bankId').dirty || this.form.get('bankId').touched)
                  ">
                                    <div class="alert alert-danger alert-height mt-1" role="alert">
                                        <div class="alert-div">Bank is required!</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-xl-4 col-xs-12 col-sm-12 mb-3">
                            <div class="mb-1   ">
                                <label class="required form-label" for="voucherName">{{ l('Voucher Name') }}</label>
                                <input [ngClass]="
                    this.form.get('voucherName').invalid &&
                    (this.form.get('voucherName').dirty || this.form.get('voucherName').touched)
                      ? 'is-danger'
                      : 'is-success'
                  " class="form-control" formControlName="voucherName" id="voucherName" placeholder="" type="text" />
                            </div>
                        </div>
                        <div class="col-md-4 col-xl-4 col-xs-12 col-sm-12 mb-3">
                            <div class="mb-1   ">
                                <label class="required form-label" for="status">{{ l('Status') }}</label>
                                <ng-select #status (keyup.enter)="gotodesoragainstBank()" [items]="against"
                                    bindLabel="displayName" bindValue="id" formControlName="status" id="status"
                                    placeholder="Select Clearance Type"></ng-select>
                            </div>
                            <div *ngIf="
                  this.form.get('status').invalid && (this.form.get('status').dirty || this.form.get('status').touched)
                ">
                                <div class="alert alert-danger alert-height mt-1" role="alert">
                                    <div class="alert-div">Status is required!</div>
                                </div>
                            </div>
                        </div>
                        <div *ngIf="form.value.againstMode == 1 && form.value.status == 0"
                            class="col-md-4 col-xl-4 col-xs-12 col-sm-12 mb-3">
                            <div class="mb-1   ">
                                <label class="required form-label" for="bankId">{{ l('Against Bank Name') }}</label>
                                <ng-select #againstBank (keyup.enter)="gotodescription()"
                                    [items]="allCashBanks$ | async" appendTo="body" bindLabel="displayName"
                                    bindValue="id" formControlName="againstLedgerId" id="againstLedgerId"
                                    placeholder="Select an item"></ng-select>

                                <div *ngIf="
                    this.form.get('bankId').invalid &&
                    (this.form.get('bankId').dirty || this.form.get('bankId').touched)
                  ">
                                    <div class="alert alert-danger alert-height mt-1" role="alert">
                                        <div class="alert-div">Bank Name is required!</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-8 col-lg-8 col-xs-8 col-sm-8">
                            <div class="mb-1   ">
                                <label for="description">{{ l('Description') }}</label>
                                <textarea #desc (keypress)="onSaveOnInput($event)" class="form-control"
                                    formControlName="description" id="description" maxlength="400" minlength="0"
                                    placeholder="" type="text"></textarea>
                            </div>
                        </div>
                        <div class="col-12 mt-3">
                            <label class="form-label me-2" for="Print">{{ l('Print') }}</label>
                            <input [(ngModel)]="isPrint" [ngModelOptions]="{ standalone: true }"
                                class="form-check-input" label="Print" type="checkbox" />
                        </div>
                    </div>
                </div>
            </form>
            <!-- {{ this.form.getRawValue() | json }} -->
        </div>
    </div>
</div>
<erp-key-event (closeEvent)="keyClose($event)" (deletEvent)="clearForm($event)" (saveEvent)="keySave($event)"
    [id]="this.id ? this.id : null"></erp-key-event>

<app-add-account-ledgers (accountLedgerSave)="getAllAccountLedger($event)" *ngIf="serialNumber === 2"
    [serialNo]="serialNumber"></app-add-account-ledgers>
