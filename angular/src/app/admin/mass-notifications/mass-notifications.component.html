<div [@routerTransition]>
    <sub-header [title]="'MassNotifications' | localize">
        <div role="actions">
            @if (isGranted('Pages.Administration.MassNotification')) {
                <button (click)="createMassNotification()" class="btn btn-secondary">
                    <i class="fa fa-plus"></i>
                    {{ l('CreateNewMassNotification') }}
                </button>
            }
            <button (click)="getPublishedNotifications()" class="btn btn-sm btn-primary blue">
                <i class="la la-refresh"></i>
                {{ l('Refresh') }}
            </button>
        </div>
    </sub-header>
    <div [class]="containerClass">
        <div class="card card-custom gutter-b">
            <div class="card-body">
                <form autocomplete="off" class="form mb-10">
                    <div>
                        <div class="row align-items-center">
                            <div class="col-xl-12">
                                <input
                                    #drp="bsDaterangepicker"
                                    [(date)]="dateRange"
                                    bsDaterangepicker
                                    class="form-control"
                                    dateRangePickerLuxonModifier
                                    id="StartEndRange"
                                    name="StartEndRange"
                                    readonly="readonly"
                                />
                            </div>
                        </div>
                    </div>
                </form>
                <div class="row align-items-center">
                    <!--<AG-Grid-Start>-->
                    <div [busyIf]="false" class="ag-grid-container">
                        <ag-grid-angular
                            #agGrid
                            (gridReady)="onGridReady($event)"
                            (paginationChanged)="onPaginationChanged($event)"
                            [columnDefs]="columnDefs"
                            [gridOptions]="gridOptions"
                            [rowData]="rowData"
                            class="ag-theme-balham"
                            style="width: 100%; height: 500px"
                        ></ag-grid-angular>
                        @if (rowData.length == 0) {
                            <div class="ag-grid-no-data">
                                {{ l('NoData') }}
                            </div>
                        }
                    </div>
                    <!--<AG-Grid-End>-->
                </div>
            </div>
        </div>
    </div>
</div>
<create-mass-notification-modal
    #createMassNotificationModalComponent
    (modalSave)="getPublishedNotifications()"
></create-mass-notification-modal>
<div
    #messageDetailModal="bs-modal"
    aria-hidden="true"
    aria-labelledby="messageDetailModal"
    bsModal
    class="modal fade"
    role="dialog"
    tabindex="-1"
>
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">
                    {{ 'Message' | localize }}
                </h4>
                <button
                    (click)="closeMessageDetailModal()"
                    [attr.aria-label]="l('Close')"
                    class="btn-close"
                    type="button"
                ></button>
            </div>
            <div [innerHTML]="messageDetailString" class="modal-body"></div>
        </div>
    </div>
</div>
