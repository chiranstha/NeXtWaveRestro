<div class="card card-custom gutter-b">
    <div class="card-header align-items-center border-0">
        <h3 class="card-title align-items-start flex-column">
            <span class="fw-bolder text-dark">
                {{ 'Editor' | localize }}
            </span>
        </h3>
    </div>
    <div class="card-body">
        <app-editor [(ngModel)]="htmlEditorInput" [style]="{ height: '300px' }" name="HtmlEditorInput"></app-editor>
    </div>
    <div class="card-footer">
        <button (click)="submitValue()" class="btn btn-sm btn-primary" type="button">{{ 'Submit' | localize }}</button>
    </div>
</div>
