<!-- permission-grid.component.html -->
<div class="permission-grid-container">
    <!-- Toolbar -->
    <div class="row mb-3">
        <div class="col-md-6">
            <div class="input-group">
                <span class="input-group-text">
                    <i class="fas fa-search"></i>
                </span>
                <input
                    (input)="filterPermissions($event.target.value)"
                    [placeholder]="l('SearchPermissions')"
                    class="form-control"
                    type="text"
                />
            </div>
        </div>
        <div class="col-md-6 text-end">
            <div class="btn-group" role="group">
                <button
                    (click)="selectAll()"
                    [title]="l('SelectAll')"
                    class="btn btn-sm btn-outline-primary"
                    type="button"
                >
                    <i class="fas fa-check-square me-1"></i>
                    {{ 'SelectAll' | localize }}
                </button>
                <button
                    (click)="deselectAll()"
                    [title]="l('DeselectAll')"
                    class="btn btn-sm btn-outline-secondary"
                    type="button"
                >
                    <i class="fas fa-square me-1"></i>
                    {{ 'DeselectAll' | localize }}
                </button>
            </div>
        </div>
    </div>
    <!-- AG Grid -->
    <div class="ag-theme-balham">
        <ag-grid-angular
            #agGrid
            (gridReady)="onGridReady($event)"
            [animateRows]="true"
            [columnDefs]="columnDefs"
            [enableCellTextSelection]="true"
            [gridOptions]="gridOptions"
            [rowData]="rowData"
            [suppressMenuHide]="true"
            class="ag-theme-balham"
            style="height: 500px; width: 100%"
        ></ag-grid-angular>
    </div>
    <!-- Summary -->
    <div class="mt-3">
        <div class="alert alert-info d-flex align-items-center">
            <i class="fas fa-info-circle me-2"></i>
            <span>
                {{ 'SelectedPermissions' | localize }}:
                <strong>{{ getGrantedPermissionNames().length }}</strong>
            </span>
        </div>
    </div>
</div>
