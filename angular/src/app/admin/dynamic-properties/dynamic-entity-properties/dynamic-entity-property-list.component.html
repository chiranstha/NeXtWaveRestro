<div class="row justify-content-end">
    <div class="col">
        @if ('Pages.Administration.DynamicEntityProperties.Create' | permission) {
            <button (click)="addNewDynamicEntityProperty()" class="btn btn-sm btn-primary float-end">
                <i class="fa fa-plus btn-md-icon"></i>
                <span class="d-none d-md-inline-block">
                    {{ 'AddNewDynamicEntityProperty' | localize }}
                </span>
            </button>
        }
    </div>
</div>
<div class="row align-items-center">
    <div class="col">
        <ag-grid-angular
            #agGrid
            (cellClicked)="onCellClicked($event)"
            (gridReady)="onGridReady($event)"
            [columnDefs]="columnDefs"
            [domLayout]="'autoHeight'"
            [pagination]="false"
            [rowData]="rowData"
            class="ag-theme-balham"
        ></ag-grid-angular>
        @if (rowData.length == 0) {
            <div class="ag-grid-no-data">
                {{ 'NoData' | localize }}
            </div>
        }
    </div>
</div>
<select-and-entity-modal #selectAnEntityModal (modalSave)="gotoEdit($event)"></select-and-entity-modal>
<manage-dynamic-entity-property-modal
    #manageDynamicEntityPropertyModalComponent
    (onPropertyChange)="getDynamicEntityProperties()"
></manage-dynamic-entity-property-modal>
