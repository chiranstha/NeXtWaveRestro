<div
    #modal="bs-modal"
    (onShown)="shown()"
    [config]="{ backdrop: 'static', keyboard: !saving }"
    appBsModal
    aria-hidden="true"
    aria-labelledby="modal"
    class="modal fade"
    role="dialog"
    tabindex="-1"
>
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <span>{{ 'SelectUsers' | localize }}</span>
                </h5>
                <button
                    (click)="close()"
                    [attr.aria-label]="l('Close')"
                    [disabled]="saving"
                    class="btn-close"
                    type="button"
                ></button>
            </div>
            <div class="modal-body">
                <form (ngSubmit)="refreshTable()" autocomplete="new-password" novalidate>
                    <div class="input-group mb-2">
                        <input
                            [(ngModel)]="filterText"
                            autoFocus
                            class="form-control"
                            name="filterText"
                            placeholder="{{ 'SearchWithThreeDot' | localize }}"
                            type="text"
                        />
                        <div class="input-group-append">
                            <button class="btn btn-sm btn-primary" type="submit">
                                <i [attr.aria-label]="l('Search')" class="fa-solid fa-magnifying-glass"></i>
                            </button>
                        </div>
                    </div>
                    <!--<AG-Grid-Start>-->
                    <div [busyIf]="$safeNavigationMigration(dataTableHelper?.isLoading)" class="ag-grid-container">
                        <ag-grid-angular
                            #agGrid
                            (gridReady)="onGridReady($event)"
                            (selectionChanged)="onSelectionChanged($event)"
                            [columnDefs]="columnDefs"
                            [defaultColDef]="{
                                resizable: true,
                                sortable: true,
                                filter: true,
                            }"
                            [paginationPageSize]="dataTableHelper?.defaultRecordsCountPerPage || 10"
                            [pagination]="false"
                            [rowData]="rowData"
                            [rowSelection]="{ mode: 'multiRow' }"
                            class="ag-theme-balham"
                            domLayout="autoHeight"
                        ></ag-grid-angular>
                        @if (rowData.length == 0) {
                            <div class="ag-grid-no-data">
                                {{ 'NoData' | localize }}
                            </div>
                        }
                    </div>
                    <!--<AG-Grid-End>-->
                </form>
            </div>
            <div class="modal-footer">
                <button
                    (click)="close()"
                    [disabled]="saving"
                    class="btn btn-sm btn-light-primary fw-bold"
                    type="button"
                >
                    {{ 'Cancel' | localize }}
                </button>
                <button
                    (click)="addUsersToOrganizationUnit()"
                    [busyText]="l('SavingWithThreeDot')"
                    [buttonBusy]="saving"
                    [disabled]="!selectedMembers?.length"
                    class="btn btn-sm btn-primary fw-bold"
                >
                    <i class="fa fa-save"></i>
                    <span>{{ 'Save' | localize }}</span>
                </button>
            </div>
        </div>
    </div>
</div>
