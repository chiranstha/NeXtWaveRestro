<div
    #exportExcelModal="bs-modal"
    [config]="{ backdrop: 'static', keyboard: !saving }"
    appBsModal
    aria-hidden="true"
    aria-labelledby="exportExcelModal"
    class="modal fade"
    role="dialog"
    tabindex="-1"
>
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">
                    <span>{{ 'ChooseColumnsForExcelExport' | localize }}</span>
                </h4>
                <button
                    (click)="close()"
                    [attr.aria-label]="l('Close')"
                    [disabled]="saving"
                    class="btn-close"
                    type="button"
                ></button>
            </div>
            @if (active) {
            <form (ngSubmit)="selectColumns()" [formGroup]="form" autocomplete="off" novalidate>
                <div class="modal-body">
                    <div class="d-flex justify-content-between">
                        <h2>{{ 'Columns' | localize }}</h2>
                        <button
                            #btnToggleAll
                            (click)="toggleClick()"
                            class="btn btn-sm btn-primary btn-sm mb-5"
                            type="button"
                        >
                            {{ toggleAllBtnText }}
                        </button>
                    </div>
                    <div formArrayName="selectedColumns">
                        @for (column of this.selectedColumnsList; track column; let i = $index) {
                        <div class="form-check mb-3">
                            <input
                                (change)="selectedColumnChange()"
                                [formControlName]="i"
                                [id]="'column' + i"
                                class="form-check-input"
                                type="checkbox"
                            />
                            <label class="form-check-label" for="column{{i}}">{{ column }}</label>
                        </div>
                        }
                    </div>
                </div>
                <div class="modal-footer">
                    <button
                        (click)="close()"
                        [disabled]="saving"
                        class="btn btn-sm btn-light-primary fw-bold"
                        type="button"
                    >
                        {{ 'Cancel' | localize }}
                    </button>
                    <button
                        [busyText]="l('SavingWithThreeDot')"
                        [buttonBusy]="saving"
                        class="btn btn-sm btn-primary fw-bold"
                        type="submit"
                    >
                        <i class="fa fa-save"></i>
                        <span>{{ 'ExportExcel' | localize }}</span>
                    </button>
                </div>
            </form>
            }
        </div>
    </div>
</div>
