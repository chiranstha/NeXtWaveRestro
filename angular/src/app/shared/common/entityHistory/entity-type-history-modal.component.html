<div
    #modal="bs-modal"
    (onShown)="shown()"
    [config]="{ backdrop: 'true' }"
    appBsModal
    aria-hidden="true"
    aria-labelledby="modal"
    class="modal fade"
    role="dialog"
    tabindex="-1"
>
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                @if (options) {
                    <h4 class="modal-title">
                        {{
                            ('ChangeLogs' | localize) +
                                ':' +
                                (options.entityTypeFullName | localize) +
                                '(' +
                                options.entityTypeDescription +
                                ')'
                        }}
                    </h4>
                }
                <button (click)="close()" [attr.aria-label]="l('Close')" class="btn-close" type="button"></button>
            </div>
            <div class="modal-body">
                <!--<AG-Grid-Start>-->
                <div [busyIf]="isLoading" class="ag-grid-container">
                    <ag-grid-angular
                        #agGrid
                        (gridReady)="onGridReady($event)"
                        (sortChanged)="onSortChanged($event)"
                        [columnDefs]="columnDefs"
                        [defaultColDef]="defaultColDef"
                        [domLayout]="'autoHeight'"
                        [rowData]="rowData"
                        class="ag-theme-balham"
                    ></ag-grid-angular>
                    @if (totalRecordsCount == 0) {
                        <div class="no-data">
                            {{ 'NoData' | localize }}
                        </div>
                    }
                </div>
                <!--<AG-Grid-End>-->
            </div>
            <div class="modal-footer">
                <button (click)="close()" class="btn btn-sm btn-light-primary fw-bold" type="button">
                    {{ 'Close' | localize }}
                </button>
            </div>
        </div>
    </div>
</div>
<entityChangeDetailModal #entityChangeDetailModal></entityChangeDetailModal>
