<div class="card card-custom h-100">
    <div class="card-header align-items-center border-0">
        <h3 class="card-title align-items-start flex-column">
            <span class="fw-bolder text-dark">General Stats</span>
        </h3>
        <div class="card-toolbar">
            <a (click)="generalStatsPieChart.reload()" class="btn btn-sm btn-primary" href="javascript:;">
                <i class="fa fa-redo"></i>
                Refresh
            </a>
        </div>
    </div>
    <div class="card-body" perfectScrollbar>
        <div class="row" style="max-height: 200px">
            <ngx-charts-pie-grid [results]="generalStatsPieChart.data"></ngx-charts-pie-grid>
        </div>
    </div>
</div>
